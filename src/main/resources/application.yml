spring:
  application:
    name: kahoot-clabs
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kahoot_clabs}
    username: ${DB_USERNAME:kahoot}
    password: ${DB_PASSWORD:kahoot}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8081}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
