spring:
  application:
    name: kahoot-clabs
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kahoot_clabs}
    username: ${DB_USERNAME:kahoot}
    password: ${DB_PASSWORD:kahoot}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8081}

app:
  # aws (default) | azure — selects file storage adapters
  storage: ${FILE_STORAGE:aws}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    admin:
      email: ${APP_SEED_ADMIN_EMAIL:admin@kahoot-clabs.local}
      password: ${APP_SEED_ADMIN_PASSWORD:Admin123!}
      first-name: ${APP_SEED_ADMIN_FIRST_NAME:System}
      last-name: ${APP_SEED_ADMIN_LAST_NAME:Admin}

storage:
  s3:
    bucket: ${AWS_S3_BUCKET:demo-clabs-kahoot}
    region: ${AWS_REGION:us-east-1}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
  azure:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    container: ${AZURE_STORAGE_CONTAINER:media}
    account-name: ${AZURE_STORAGE_ACCOUNT:}
    public-base-url: ${AZURE_STORAGE_PUBLIC_BASE_URL:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    kahoot.clabs.kahoot_clabs: DEBUG
    org.springframework.web: INFO
    software.amazon.awssdk: INFO
    com.azure: INFO
