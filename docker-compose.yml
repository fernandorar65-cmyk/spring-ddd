services:
  postgres:
    image: postgres:16-alpine
    container_name: kahoot-clabs-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kahoot_clabs
      POSTGRES_USER: kahoot
      POSTGRES_PASSWORD: kahoot
    volumes:
      - kahoot_clabs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kahoot -d kahoot_clabs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kahoot_clabs_pgdata:
